[build]
  functions = "netlify/functions"
  publish = "."

# Heti riport — minden csütörtök 07:00 UTC = 09:00 Budapest
[[scheduled-functions]]
  name = "weekly-report"
  cron = "0 7 * * 4"

# Hírlevél sorozat küldő — minden kedd 08:00 UTC = 10:00 Budapest (legjobb nyitási arány)
[[scheduled-functions]]
  name = "send-weekly-newsletter"
  cron = "0 8 * * 2"

# Napi Sheets export — minden nap 21:50 UTC = 23:50 Budapest
[[scheduled-functions]]
  name = "daily-sheets"
  cron = "50 21 * * *"

# Leiratkozás átirányítás a function-re
[[redirects]]
  from = "/leiratkozas"
  to   = "/.netlify/functions/unsubscribe"
  status = 200

# Admin dashboard
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# Aloldalak
[[redirects]]
  from = "/tesztek"
  to   = "/tesztek.html"
  status = 200

[[redirects]]
  from = "/kollagen"
  to   = "/kollagen.html"
  status = 200
