[build]
  functions = "netlify/functions"
  publish = "."

# Heti riport — minden hétfő 07:00 UTC (= 09:00 Budapest nyáron)
[[scheduled-functions]]
  name = "weekly-report"
  cron = "0 7 * * 1"

# Napi Sheets export — minden nap 21:50 UTC (= 23:50 Budapest)
[[scheduled-functions]]
  name = "daily-sheets"
  cron = "50 21 * * *"
