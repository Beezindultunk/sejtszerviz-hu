[build]
  functions = "netlify/functions"
  publish = "."

# Heti riport — minden csütörtök 07:00 UTC = 09:00 Budapest
[[scheduled-functions]]
  name = "weekly-report"
  cron = "0 7 * * 4"

# Napi Sheets export — minden nap 21:50 UTC = 23:50 Budapest
[[scheduled-functions]]
  name = "daily-sheets"
  cron = "50 21 * * *"
